[project]
name = "pixel-clock"
version = "0.1.0"
description = "A small API for timezone-aware pixel clocks"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "A", "ASYNC", "C4", "DTZ",
    "G", "LOG", "PTH", "PT", "RUF", "SIM",
]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["app_final.py", "settings.py", "rendering.py"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--cov", "--cov-report=term-missing"]
xfail_strict = true

[tool.coverage.run]
source = ["app_final", "settings", "rendering"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
precision = 2

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4,<3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.2",
]
